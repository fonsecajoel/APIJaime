        - paragraph [ref=f5e534]: Upstash powers companies of every size and industry, from cutting-edge AI to everyday retail
      - generic [ref=f5e535]:
        - generic [ref=f5e537]:
          - link [ref=f5e539] [cursor=pointer]:
            - /url: /customers/supabase
            - paragraph [ref=f5e553]: "\"At our scale, it's important to use the right tool for the right workload. Upstash lets us power low-latency edge use cases globally, while still keeping our overall architecture simple and cost-effective.\""
          - link [ref=f5e555] [cursor=pointer]:
            - /url: /customers/okara
            - paragraph [ref=f5e562]: "\"We launched and immediately saw significant demand. Upstash was one of those decisions that we made very quickly because it solved real scaling problems without slowing down the team.\""
          - link [ref=f5e564] [cursor=pointer]:
            - /url: /customers/paul-smith
            - paragraph [ref=f5e573]: "\"Upstash's global Redis has been a game changer. Low latency, zero downtime, and easy to use across frontend and backend. With brilliant customer service and fast response times, we deliver the best shopping experience.\""
          - link [ref=f5e575] [cursor=pointer]:
            - /url: /customers/openart
            - paragraph [ref=f5e583]: "\"Developer experience became significantly better than what we experienced with traditional cloud service providers. The observability improvements alone were game-changing for our small team.\""
          - link [ref=f5e585] [cursor=pointer]:
            - /url: /customers/dub
            - paragraph [ref=f5e590]: "\"The Upstash JS SDK is incredibly easy to use – all I needed to do was run npm install, initialize the Redis instance, and start running redis commands – super simple!\""
          - link [ref=f5e592] [cursor=pointer]:
            - /url: /customers/zapier
            - paragraph [ref=f5e605]: "\"We chose Upstash specifically because it offers an HTTP interface for Redis, which perfectly suited our needs\""
          - link [ref=f5e607] [cursor=pointer]:
            - /url: /customers/branch
            - paragraph [ref=f5e617]: "\"Before Upstash we used Redis Cloud. This was not serverless, you had to think about instance size, memory usage etc. which we really don't want to do as it pulls our focus from product engineering, any time spent on operations like this is less time spent on our products and what differentiates Branch.\""
          - link [ref=f5e619] [cursor=pointer]:
            - /url: /customers/humata
            - paragraph [ref=f5e632]: "\"Before Upstash QStash, we struggled with upload reliability and request failures, but with their support, we've achieved over 99.9% reliability for millions of users. Their seamless integration with our serverless architecture has made developing new features, like importing entire knowledge bases, much simpler.\""
          - link [ref=f5e634] [cursor=pointer]:
            - /url: /customers/maker
            - paragraph [ref=f5e641]: "\"The ability to exceed the resident memory of the machine that Upstash has built opens up more possibilities, and allows reading and writing directly to Redis and skipping the middle-man\""
          - link [ref=f5e643] [cursor=pointer]:
            - /url: /customers/clickfunnels
            - paragraph [ref=f5e652]: "\"We've been working closely together on improving alerting across their clusters, and it feels less like using a vendor and more like building the future of edge infrastructure together.\""
          - link [ref=f5e654] [cursor=pointer]:
            - /url: /customers/dropee
            - paragraph [ref=f5e664]: "\"Since day one we haven't had to worry about traffic peaks. The interface is a pleasure to use and support has been amazing, especially when we hit limits.\""
